# Isolated PostgreSQL for integration tests. Never points at the application database.
name: traystack-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: traystack
      POSTGRES_PASSWORD: traystack_test
      POSTGRES_DB: traystack_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U traystack -d traystack_test]
      interval: 2s
      timeout: 3s
      retries: 20
