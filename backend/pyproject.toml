[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traystack"
version = "0.3.0"
description = "Traceable contract storage and retrieval"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.25,<2",
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "swagger-ui-py>=25.7.1,<26",
  "rapidfuzz>=3.14,<4",
  "numpy>=2.2,<3",
  "onnxruntime>=1.23,<2",
  "tokenizers>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.package-data]
traystack = ["model_license.txt"]

[tool.setuptools.packages.find]
include = ["traystack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database", "ocr: runs real Tesseract OCR"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
